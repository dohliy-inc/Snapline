[package]
name = "engine"
version = "2.0.2"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = "0.7.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }
