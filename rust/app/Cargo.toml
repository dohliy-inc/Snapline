[package]
name = "snapline"
version = "2.0.3"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
engine = { version = "2.0.3", path = "../engine" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
rfd = "0.18.0"
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinInet", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_UI_Controls", "Win32_Security"] }

[build-dependencies]
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = ["png"] }
winresource = "0.1.34"
